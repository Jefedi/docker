model:
  provider: custom
  default: mistral-medium-latest
  base_url: https://api.mistral.ai/v1
  api_key_env: MISTRAL_API_KEY
fallback_providers:
  - provider: custom
    model: open-mistral-nemo
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
telegram:
  reactions: false
  allowed_chats: ''
  extra:
    rich_messages: false
platforms:
  telegram:
    - browser
    - clarify
    - code_execution
    - cronjob
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
mcp_servers:
  n8n-mcp:
    connect_timeout: 30
    enabled: true
    headers:
      Authorization: Bearer ${N8N_MCP_TOKEN}
    timeout: 180
    url: http://localhost:5678/mcp-server/http
onboarding:
  seen:
    busy_input_prompt: true
