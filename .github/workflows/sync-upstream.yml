name: sync-upstream

on:
  schedule:
    # Check every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(gh release view --repo anonaddy/anonaddy --json tagName -q .tagName)
          echo "Latest upstream release: $LATEST"
          VERSION="${LATEST#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version from Dockerfile
        id: current
        run: |
          CURRENT=$(grep '^ARG ANONADDY_VERSION=' Dockerfile | head -1 | sed 's/ARG ANONADDY_VERSION=//')
          echo "Current Dockerfile version: $CURRENT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: check
        run: |
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          echo "Upstream: $UPSTREAM | Current: $CURRENT"
          if [ "$UPSTREAM" != "$CURRENT" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=$UPSTREAM" >> "$GITHUB_OUTPUT"
            echo "New version detected: $UPSTREAM (current: $CURRENT)"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.updated == 'true'
        run: |
          NEW_VERSION="${{ steps.check.outputs.version }}"
          sed -i "s/^ARG ANONADDY_VERSION=.*/ARG ANONADDY_VERSION=${NEW_VERSION}/" Dockerfile
          echo "Updated Dockerfile to version ${NEW_VERSION}"
          grep 'ARG ANONADDY_VERSION' Dockerfile

      - name: Commit and tag
        if: steps.check.outputs.updated == 'true'
        run: |
          NEW_VERSION="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "addy ${NEW_VERSION}"
          git tag "v${NEW_VERSION}-r"
          git push origin master
          git push origin "v${NEW_VERSION}-r"